# Quiet defaults for the Java test compute engine. The JNI / control-plane
# disconnect paths log WARN/ERROR by default, but several Elixir-side
# matrix tests intentionally drive disconnect/reconnect cycles — printing
# every transition to stdout drowns the actual ExUnit output.
#
# Override per-run with `-Dorg.slf4j.simpleLogger.defaultLogLevel=info`
# when debugging the Java side.
org.slf4j.simpleLogger.defaultLogLevel=error
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true

# `CommandRouter` logs an ERROR every time a CONNECT_SOCKET command arrives
# after the controller has already torn down the socket dir (test teardown
# race). The transport layer surfaces the same error to the controller via
# the protobuf response, so the Java-side ERROR is duplicate signal that
# only matters when debugging the Java SDK in isolation.
org.slf4j.simpleLogger.log.com.flezha.sdk.runtime.control.CommandRouter=off
